<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Онлайн-запись</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #f2f4f7);
      --card: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #111827);
      --hint: var(--tg-theme-hint-color, #6b7280);
      --accent: var(--tg-theme-button-color, #2563eb);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(128, 128, 128, 0.16);
      --success: #16a34a;
      --danger: #dc2626;
      --warn: #d97706;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: calc(80px + env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    .container { max-width: 560px; margin: 0 auto; padding: 12px 14px; }

    /* Header */
    .header {
      position: sticky; top: 0; z-index: 20;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .header-title { font-size: 17px; font-weight: 700; line-height: 1.2; }
    .header-sub { font-size: 12px; color: var(--hint); }
    .header-actions { display: flex; gap: 6px; align-items: center; }

    /* Buttons */
    .btn {
      border: none; border-radius: 10px; padding: 9px 13px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      transition: opacity .15s, transform .1s;
      text-decoration: none;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-soft { background: rgba(128,128,128,0.12); color: var(--text); }
    .btn-success { background: rgba(22,163,74,0.14); color: var(--success); }
    .btn-danger { background: rgba(220,38,38,0.12); color: var(--danger); }
    .btn-warn { background: rgba(217,119,6,0.14); color: var(--warn); }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
    .btn-full { width: 100%; padding: 12px; font-size: 15px; }

    /* Cards & Layout */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 13px;
      margin-bottom: 10px;
    }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
    .muted { color: var(--hint); font-size: 12px; }
    .price { font-weight: 700; font-size: 15px; white-space: nowrap; }

    /* Segmented control */
    .segments {
      display: flex; background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 3px; margin-bottom: 12px; gap: 3px;
    }
    .seg-btn {
      flex: 1; border: none; background: transparent; color: var(--hint);
      padding: 8px 6px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .seg-btn.active { background: var(--accent); color: var(--accent-text); }

    /* Badges */
    .badge {
      display: inline-block; padding: 3px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 600;
    }
    .b-pending { background: rgba(217,119,6,0.15); color: var(--warn); }
    .b-confirmed { background: rgba(37,99,235,0.14); color: var(--accent); }
    .b-completed { background: rgba(22,163,74,0.14); color: var(--success); }
    .b-cancelled, .b-no_show { background: rgba(220,38,38,0.14); color: var(--danger); }

    .comment-box {
      background: rgba(128,128,128,0.08);
      border-radius: 8px; padding: 8px 10px; font-size: 12px;
      color: var(--hint); margin: 8px 0;
    }

    /* Inputs */
    label { display: block; font-size: 12px; font-weight: 600; color: var(--hint); margin: 10px 0 4px; }
    input, select, textarea {
      width: 100%; padding: 10px 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-size: 14px; font-family: inherit;
    }
    textarea { resize: vertical; min-height: 68px; }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: var(--card); border-top: 1px solid var(--border);
      display: flex; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
    }
    .nav-item {
      flex: 1; border: none; background: transparent; color: var(--hint);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      font-size: 11px; font-weight: 600; cursor: pointer; padding: 4px 0;
    }
    .nav-item.active { color: var(--accent); }
    .nav-icon { font-size: 18px; line-height: 1; }

    /* Slots grid */
    .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 8px; }
    .slot-btn {
      padding: 10px 4px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--card); color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .slot-btn.selected { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

    /* Service selectable item */
    .svc-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px; border-radius: 12px; border: 1.5px solid var(--border);
      background: var(--card); margin-bottom: 8px; cursor: pointer;
    }
    .svc-item.selected { border-color: var(--accent); background: rgba(37,99,235,0.06); }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.48); z-index: 50;
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
      background: var(--card); border-radius: 18px 18px 0 0;
      padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
    }

    .toast {
      position: fixed; top: 64px; left: 50%; transform: translateX(-50%);
      background: #111827; color: #fff; padding: 9px 14px; border-radius: 999px;
      font-size: 13px; font-weight: 600; z-index: 100; display: none;
    }
  </style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-title" id="headerTitle">Онлайн-запись</div>
    <div class="header-sub" id="headerSub">Загрузка...</div>
  </div>
  <div class="header-actions">
    <button class="btn btn-soft btn-sm" id="syncBtn" onclick="syncFromSheets(true)" title="Обновить">↻</button>
    <button class="btn btn-soft btn-sm" id="roleToggleBtn" style="display:none" onclick="toggleRole()">Как клиент</button>
    <button class="btn btn-primary btn-sm" id="topActionBtn" style="display:none" onclick="openBlockSlotModal()">🔒 Окно</button>
  </div>
</div>

<div class="container" id="app"></div>
<div class="bottom-nav" id="bottomNav"></div>
<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
  <div class="modal" id="modalContent"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== НАСТРОЙКИ ЗАПУСКА ===================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxNqGFVN8S1_EOSjoQZ5bL8Yb-B_Awb1BFhhmnIFVattOE5QsuOsOEsIo3H2I-swoxx/exec';

const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

const tgUser = tg?.initDataUnsafe?.user || null;
const tgId = tgUser?.id ? String(tgUser.id) : '';
let isAdminUser = false;

function haptic(type = 'light') {
  try { tg?.HapticFeedback?.impactOccurred(type); } catch {}
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => el.style.display = 'none', 2300);
}

const todayStr = () => new Date().toISOString().slice(0, 10);
const addDaysStr = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const fmtRub = (n) => Number(n || 0).toLocaleString('ru-RU') + ' ₽';
const toMin = (hhmm) => { const [h, m] = String(hhmm || '00:00').split(':').map(Number); return h * 60 + m; };
const fromMin = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const uid = () => Math.random().toString(36).slice(2, 10);

/* ===================== СТАТУСЫ (РУС + СОВМЕСТИМОСТЬ С АНГЛ) ===================== */
const STATUS = {
  PENDING: 'Ожидает',
  CONFIRMED: 'Подтверждена',
  COMPLETED: 'Завершена',
  CANCELLED: 'Отменена',
  NO_SHOW: 'Не пришёл'
};

const STATUS_META = {
  [STATUS.PENDING]:   { label: 'Ожидает',      badge: 'b-pending' },
  [STATUS.CONFIRMED]: { label: 'Подтверждена', badge: 'b-confirmed' },
  [STATUS.COMPLETED]: { label: 'Завершена',    badge: 'b-completed' },
  [STATUS.CANCELLED]: { label: 'Отменена',     badge: 'b-cancelled' },
  [STATUS.NO_SHOW]:   { label: 'Не пришёл',    badge: 'b-no_show' }
};

function normalizeStatus(raw) {
  const s = String(raw || '').trim().toLowerCase();
  if (s === 'pending' || s === 'ожидает') return STATUS.PENDING;
  if (s === 'confirmed' || s === 'подтверждена' || s === 'запланировано') return STATUS.CONFIRMED;
  if (s === 'completed' || s === 'завершена' || s === 'выполнено') return STATUS.COMPLETED;
  if (s === 'cancelled' || s === 'canceled' || s === 'отменена' || s === 'отменено') return STATUS.CANCELLED;
  if (s === 'no_show' || s === 'не пришёл' || s === 'не пришел') return STATUS.NO_SHOW;
  return raw ? String(raw).trim() : STATUS.CONFIRMED;
}

function getStatusMeta(status) {
  const norm = normalizeStatus(status);
  return STATUS_META[norm] || { label: norm, badge: 'b-confirmed' };
}

function isActiveStatus(status) {
  const norm = normalizeStatus(status);
  return norm === STATUS.PENDING || norm === STATUS.CONFIRMED;
}

function isCancelledStatus(status) {
  const norm = normalizeStatus(status);
  return norm === STATUS.CANCELLED || norm === STATUS.NO_SHOW;
}

const STORAGE_KEY = 'tma_booking_v2';
const DEFAULT_DB = {
  settings: {
    timezoneLabel: 'МСК',
    workStart: '10:00',
    workEnd: '20:00',
    breakStart: '13:00',
    breakEnd: '14:00',
    slotStep: 30,
    bufferMin: 15,
    horizonDays: 30,
    minLeadHours: 2,
    cancelLimitHours: 4,
    autoConfirm: true,
    masterTelegram: 'master_support',
    address: 'Уточняется при записи'
  },
  services: [
    { id: 's1', category: 'Основные', title: 'Мужская стрижка', price: 2200, duration: 60, active: true },
    { id: 's2', category: 'Комплексы', title: 'Комплекс «Стрижка + Борода»', price: 3400, duration: 90, active: true }
  ],
  appointments: [],
  blockedSlots: []
};

let db = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || structuredClone(DEFAULT_DB);
if (Array.isArray(db.appointments)) {
  db.appointments = db.appointments.map(a => ({ ...a, status: normalizeStatus(a.status) }));
}
function saveDB() { localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); }

const state = {
  role: 'client',
  clientTab: 'book',
  scheduleFilter: 'today',
  scheduleDate: todayStr(),
  bookingStep: 1,
  selectedServiceIds: [],
  selectedDate: todayStr(),
  selectedSlot: null,
  bookingName: tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') : '',
  bookingPhone: '',
  bookingComment: '',
  myTab: 'upcoming'
};

function getClientKey() {
  if (tgUser?.id) return String(tgUser.id);
  let guestId = localStorage.getItem('tma_guest_id');
  if (!guestId) {
    guestId = 'guest_' + uid();
    localStorage.setItem('tma_guest_id', guestId);
  }
  return guestId;
}

async function apiPost(payload) {
  if (!API_URL) return { ok: true, localOnly: true };
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ ...payload, tgId })
    });
    return await res.json();
  } catch (err) {
    toast('Нет связи с таблицей');
    return { ok: false, error: err.message };
  }
}

async function syncFromSheets(showNotice = false) {
  if (!API_URL) {
    if (showNotice) toast('Локальный режим (укажите API_URL)');
    render();
    return;
  }
  try {
    const url = `${API_URL}?action=sync&tgId=${encodeURIComponent(tgId)}`;
    const res = await fetch(url);
    const data = await res.json();
    if (!data.ok) return;

    isAdminUser = Boolean(data.isAdmin);
    state.role = isAdminUser ? 'admin' : 'client';

    if (Array.isArray(data.services) && data.services.length) {
      db.services = data.services;
    }
    if (Array.isArray(data.blockedSlots)) {
      db.blockedSlots = data.blockedSlots;
    }
    if (data.settings && Object.keys(data.settings).length) {
      const s = data.settings;
      db.settings = {
        ...db.settings,
        timezoneLabel: s.timezoneLabel ?? db.settings.timezoneLabel,
        workStart: s.workStart ?? db.settings.workStart,
        workEnd: s.workEnd ?? db.settings.workEnd,
        breakStart: s.breakStart ?? db.settings.breakStart,
        breakEnd: s.breakEnd ?? db.settings.breakEnd,
        slotStep: Number(s.slotStep ?? db.settings.slotStep),
        bufferMin: Number(s.bufferMin ?? db.settings.bufferMin),
        horizonDays: Number(s.horizonDays ?? db.settings.horizonDays),
        minLeadHours: Number(s.minLeadHours ?? db.settings.minLeadHours),
        cancelLimitHours: Number(s.cancelLimitHours ?? db.settings.cancelLimitHours),
        autoConfirm: String(s.autoConfirm ?? db.settings.autoConfirm) !== 'false',
        masterTelegram: s.masterTelegram ?? db.settings.masterTelegram,
        address: s.address ?? db.settings.address
      };
    }
    if (Array.isArray(data.appointments)) {
      db.appointments = data.appointments.map(a => ({
        ...a,
        status: normalizeStatus(a.status)
      }));
    }
    saveDB();
    render();
    if (showNotice) toast('Расписание обновлено');
  } catch (err) {
    if (showNotice) toast('Ошибка обновления');
  }
}

function getFreeSlots(dateStr, durationMin) {
  const s = db.settings;
  const start = toMin(s.workStart);
  const end = toMin(s.workEnd);
  const brkStart = s.breakStart ? toMin(s.breakStart) : null;
  const brkEnd = s.breakEnd ? toMin(s.breakEnd) : null;
  const step = Number(s.slotStep) || 30;
  const buf = Number(s.bufferMin) || 0;

  const busy = db.appointments
    .filter(a => a.date === dateStr && isActiveStatus(a.status))
    .map(a => ({ start: toMin(a.time), end: toMin(a.time) + Number(a.duration || 60) + Number(a.buffer || 0) }));

  db.blockedSlots
    .filter(b => b.date === dateStr)
    .forEach(b => busy.push({ start: toMin(b.start), end: toMin(b.end) }));

  const now = new Date();
  const isToday = dateStr === todayStr();
  const minAllowedMin = isToday ? (now.getHours() * 60 + now.getMinutes() + (Number(s.minLeadHours) || 0) * 60) : -1;

  const slots = [];
  for (let t = start; t + durationMin <= end; t += step) {
    if (isToday && t < minAllowedMin) continue;
    const slotEndWithBuf = t + durationMin + buf;
    const hitsBreak = brkStart !== null && brkEnd !== null && (t < brkEnd && (t + durationMin) > brkStart);
    if (hitsBreak) continue;
    const hitsBusy = busy.some(b => t < b.end && slotEndWithBuf > b.start);
    if (!hitsBusy) slots.push(fromMin(t));
  }
  return slots;
}

function toggleRole() {
  if (!isAdminUser) return;
  haptic('medium');
  state.role = state.role === 'admin' ? 'client' : 'admin';
  state.bookingStep = 1;
  render();
}

function render() {
  const showAdmin = isAdminUser && state.role === 'admin';
  const roleBtn = document.getElementById('roleToggleBtn');
  const blockBtn = document.getElementById('topActionBtn');

  roleBtn.style.display = isAdminUser ? 'inline-flex' : 'none';
  roleBtn.textContent = showAdmin ? 'Как клиент' : 'В админку';
  blockBtn.style.display = showAdmin ? 'inline-flex' : 'none';

  if (showAdmin) {
    document.getElementById('headerTitle').textContent = 'Записи мастера';
    document.getElementById('headerSub').textContent = `${db.settings.timezoneLabel} • управление в таблице`;
    document.getElementById('bottomNav').style.display = 'none';
    renderAdminView();
  } else {
    document.getElementById('headerTitle').textContent = state.clientTab === 'book' ? 'Онлайн-запись' : 'Мои записи';
    document.getElementById('headerSub').textContent = db.settings.address;
    document.getElementById('bottomNav').style.display = 'flex';
    renderClientNav();
    if (state.clientTab === 'book') renderClientBooking();
    else renderClientMyBookings();
  }
}

function renderClientNav() {
  const tabs = [
    ['book', '✨', 'Записаться'],
    ['my', '📋', 'Мои записи']
  ];
  document.getElementById('bottomNav').innerHTML = tabs.map(([id, icon, label]) => `
    <button class="nav-item ${state.clientTab === id ? 'active' : ''}" onclick="state.clientTab='${id}';haptic();render()">
      <span class="nav-icon">${icon}</span><span>${label}</span>
    </button>
  `).join('');
}

/* ===================== ЛЁГКАЯ АДМИНКА ДЛЯ ВЛАДЕЛЬЦА ===================== */
function renderAdminView() {
  let list = [...db.appointments];
  if (state.scheduleFilter === 'today') list = list.filter(a => a.date === todayStr());
  if (state.scheduleFilter === 'tomorrow') list = list.filter(a => a.date === addDaysStr(1));
  if (state.scheduleFilter === 'date') list = list.filter(a => a.date === state.scheduleDate);
  list.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  const sum = list
    .filter(a => !isCancelledStatus(a.status))
    .reduce((acc, a) => acc + Number(a.totalPrice || 0), 0);

  let html = `
    <div class="segments">
      <button class="seg-btn ${state.scheduleFilter==='today'?'active':''}" onclick="state.scheduleFilter='today';render()">Сегодня</button>
      <button class="seg-btn ${state.scheduleFilter==='tomorrow'?'active':''}" onclick="state.scheduleFilter='tomorrow';render()">Завтра</button>
      <button class="seg-btn ${state.scheduleFilter==='date'?'active':''}" onclick="state.scheduleFilter='date';render()">Дата</button>
      <button class="seg-btn ${state.scheduleFilter==='all'?'active':''}" onclick="state.scheduleFilter='all';render()">Все</button>
    </div>
  `;

  if (state.scheduleFilter === 'date') {
    html += `<div class="card"><input type="date" value="${state.scheduleDate}" onchange="state.scheduleDate=this.value;render()"></div>`;
  }

  html += `
    <div class="card row">
      <div>
        <div class="muted">ЗАПИСЕЙ</div>
        <div style="font-weight:700;font-size:16px">${list.length}</div>
      </div>
      <div style="text-align:right">
        <div class="muted">Сумма</div>
        <div style="font-weight:800;font-size:16px;color:var(--accent)">${fmtRub(sum)}</div>
      </div>
    </div>
  `;

  if (!list.length) {
    html += `<div class="card muted" style="text-align:center;padding:28px">Записей на выбранный период нет</div>`;
  }

  list.forEach(a => {
    const normStatus = normalizeStatus(a.status);
    const meta = getStatusMeta(normStatus);
    const svcNames = (a.services || []).map(s => s.title).join(', ') || 'Услуга';
    html += `
      <div class="card">
        <div class="row" style="align-items:flex-start">
          <div>
            <div style="font-weight:700;font-size:15px">${a.date} • ${a.time}</div>
            <div style="font-weight:600;margin-top:2px">${a.clientName || 'Клиент'}</div>
            <div class="muted">${svcNames} (${a.duration || 60} мин)</div>
            <div class="row-wrap" style="margin-top:4px">
              ${a.username ? `<a class="muted" style="color:var(--accent)" href="https://t.me/${a.username}" target="_blank">@${a.username}</a>` : ''}
              ${a.clientPhone ? `<a class="muted" href="tel:${a.clientPhone}">${a.clientPhone}</a>` : ''}
            </div>
          </div>
          <div style="text-align:right">
            <div class="price">${fmtRub(a.totalPrice)}</div>
            <span class="badge ${meta.badge}">${meta.label}</span>
          </div>
        </div>
        ${a.comment ? `<div class="comment-box">${a.comment}</div>` : ''}
        <div class="row-wrap" style="margin-top:10px">
          ${normStatus === STATUS.PENDING ? `<button class="btn btn-primary btn-sm" style="flex:1" onclick="changeStatus('${a.id}','${STATUS.CONFIRMED}')">Подтвердить</button>` : ''}
          ${normStatus !== STATUS.COMPLETED ? `<button class="btn btn-success btn-sm" style="flex:1" onclick="changeStatus('${a.id}','${STATUS.COMPLETED}')">Завершена</button>` : ''}
          ${normStatus !== STATUS.NO_SHOW ? `<button class="btn btn-warn btn-sm" onclick="changeStatus('${a.id}','${STATUS.NO_SHOW}')">Не пришёл</button>` : ''}
          ${normStatus !== STATUS.CANCELLED ? `<button class="btn btn-danger btn-sm" onclick="changeStatus('${a.id}','${STATUS.CANCELLED}')">Отменить</button>` : ''}
        </div>
      </div>
    `;
  });

  document.getElementById('app').innerHTML = html;
}

async function changeStatus(id, status) {
  const appt = db.appointments.find(x => String(x.id) === String(id));
  if (!appt) return;
  const norm = normalizeStatus(status);
  appt.status = norm;
  saveDB();
  haptic('medium');
  toast(`Статус: ${getStatusMeta(norm).label}`);
  render();
  await apiPost({ action: 'update_status', id, status: norm });
}

function openBlockSlotModal() {
  openModal(`
    <div class="row"><h3 style="margin:0">Заблокировать время</h3><button class="btn btn-soft btn-sm" onclick="closeModal()">✕</button></div>
    <label>Дата</label><input type="date" id="bl_date" value="${todayStr()}">
    <div class="row">
      <div style="flex:1"><label>С</label><input type="time" id="bl_start" value="14:00"></div>
      <div style="flex:1"><label>До</label><input type="time" id="bl_end" value="16:00"></div>
    </div>
    <label>Причина</label><input id="bl_reason" placeholder="Перерыв / личные дела">
    <button class="btn btn-primary btn-full" style="margin-top:12px" onclick="saveBlockedSlot()">Заблокировать</button>
  `);
}

async function saveBlockedSlot() {
  const block = {
    id: uid(),
    date: document.getElementById('bl_date').value,
    start: document.getElementById('bl_start').value,
    end: document.getElementById('bl_end').value,
    reason: document.getElementById('bl_reason').value.trim()
  };
  db.blockedSlots.push(block);
  saveDB();
  closeModal();
  toast('Время заблокировано');
  render();
  await apiPost({ action: 'add_block', block });
}

/* ===================== КЛИЕНТСКИЙ СЦЕНАРИЙ ЗАПИСИ ===================== */
function renderClientBooking() {
  const selectedSvcs = db.services.filter(s => s.active && state.selectedServiceIds.includes(s.id));
  const totalDur = selectedSvcs.reduce((s, x) => s + Number(x.duration || 60), 0);
  const totalPrice = selectedSvcs.reduce((s, x) => s + Number(x.price || 0), 0);

  if (state.bookingStep === 1) {
    const active = db.services.filter(s => s.active);
    document.getElementById('app').innerHTML = `
      <div class="muted" style="margin-bottom:8px">Шаг 1 из 3 • Выберите услугу</div>
      ${active.map(s => {
        const sel = state.selectedServiceIds.includes(s.id);
        return `
          <div class="svc-item ${sel ? 'selected' : ''}" onclick="toggleSelectService('${s.id}')">
            <div>
              <div style="font-weight:700">${s.title}</div>
              <div class="muted">${s.duration} мин</div>
            </div>
            <div style="text-align:right">
              <div class="price">${fmtRub(s.price)}</div>
              <div class="muted">${sel ? '✓ Выбрано' : '+ Выбрать'}</div>
            </div>
          </div>
        `;
      }).join('')}
      ${selectedSvcs.length ? `
        <div class="card row" style="position:sticky;bottom:74px;box-shadow:0 6px 20px rgba(0,0,0,0.12)">
          <div><div class="muted">${selectedSvcs.length} усл. • ${totalDur} мин</div><div class="price">${fmtRub(totalPrice)}</div></div>
          <button class="btn btn-primary" onclick="state.bookingStep=2;state.selectedSlot=null;haptic();render()">Выбрать время →</button>
        </div>
      ` : ''}
    `;
  } else if (state.bookingStep === 2) {
    const slots = getFreeSlots(state.selectedDate, totalDur);
    document.getElementById('app').innerHTML = `
      <button class="btn btn-soft btn-sm" style="margin-bottom:10px" onclick="state.bookingStep=1;render()">← К услугам</button>
      <div class="card">
        <div class="muted">Шаг 2 из 3 • Время указано по ${db.settings.timezoneLabel}</div>
        <label>Дата</label>
        <input type="date" min="${todayStr()}" max="${addDaysStr(db.settings.horizonDays)}" value="${state.selectedDate}" onchange="state.selectedDate=this.value;state.selectedSlot=null;render()">
        <label style="margin-top:12px">Свободные слоты (${totalDur} мин)</label>
        ${slots.length ? `
          <div class="slots-grid">
            ${slots.map(t => `<button class="slot-btn ${state.selectedSlot===t?'selected':''}" onclick="state.selectedSlot='${t}';haptic();render()">${t}</button>`).join('')}
          </div>
        ` : `<div class="comment-box">На выбранную дату свободных окон нет</div>`}
      </div>
      ${state.selectedSlot ? `<button class="btn btn-primary btn-full" onclick="state.bookingStep=3;haptic();render()">Продолжить на ${state.selectedSlot} →</button>` : ''}
    `;
  } else {
    document.getElementById('app').innerHTML = `
      <button class="btn btn-soft btn-sm" style="margin-bottom:10px" onclick="state.bookingStep=2;render()">← К выбору времени</button>
      <div class="card">
        <div class="muted">Шаг 3 из 3 • Подтверждение</div>
        <div style="font-weight:700;font-size:16px;margin:6px 0">${state.selectedDate} в ${state.selectedSlot} (${db.settings.timezoneLabel})</div>
        <div class="muted">${selectedSvcs.map(s=>s.title).join(', ')} • <b>${fmtRub(totalPrice)}</b></div>
        <label>Ваше имя</label>
        <input id="cb_name" value="${state.bookingName}" placeholder="Как к вам обращаться">
        <label>Телефон или @username</label>
        <input id="cb_phone" value="${state.bookingPhone}" placeholder="+7 999 000-00-00 или @username">
        <label>Комментарий</label>
        <textarea id="cb_comment" placeholder="Пожелания к визиту">${state.bookingComment}</textarea>
      </div>
      <button class="btn btn-primary btn-full" onclick="submitClientBooking()">Подтвердить запись</button>
    `;
  }
}

function toggleSelectService(id) {
  haptic('light');
  if (state.selectedServiceIds.includes(id)) state.selectedServiceIds = state.selectedServiceIds.filter(x => x !== id);
  else state.selectedServiceIds.push(id);
  render();
}

async function submitClientBooking() {
  const name = document.getElementById('cb_name').value.trim();
  const phone = document.getElementById('cb_phone').value.trim();
  const comment = document.getElementById('cb_comment').value.trim();
  if (!name || !phone) return toast('Укажите имя и контакт');

  state.bookingName = name;
  state.bookingPhone = phone;
  state.bookingComment = comment;

  const svcs = db.services.filter(s => s.active && state.selectedServiceIds.includes(s.id));
  const totalDur = svcs.reduce((s, x) => s + Number(x.duration || 60), 0);
  const totalPrice = svcs.reduce((s, x) => s + Number(x.price || 0), 0);

  const appt = {
    id: uid(),
    clientKey: getClientKey(),
    clientName: name,
    clientPhone: phone,
    telegramId: tgUser?.id || '',
    username: tgUser?.username || '',
    date: state.selectedDate,
    time: state.selectedSlot,
    duration: totalDur,
    buffer: Number(db.settings.bufferMin) || 0,
    totalPrice,
    status: db.settings.autoConfirm ? STATUS.CONFIRMED : STATUS.PENDING,
    comment,
    services: svcs.map(s => ({ id: s.id, title: s.title, price: s.price, duration: s.duration }))
  };

  db.appointments.push(appt);
  saveDB();
  haptic('medium');
  toast('Запись оформлена');
  state.selectedServiceIds = [];
  state.selectedSlot = null;
  state.bookingComment = '';
  state.bookingStep = 1;
  state.clientTab = 'my';
  render();
  await apiPost({ action: 'create_appointment', appointment: appt });
}

function renderClientMyBookings() {
  const myKey = getClientKey();
  const mine = db.appointments
    .filter(a => String(a.clientKey || a.telegramId || '') === String(myKey))
    .sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));

  const list = state.myTab === 'upcoming'
    ? mine.filter(a => isActiveStatus(a.status))
    : mine.filter(a => !isActiveStatus(a.status));

  let html = `
    <div class="segments">
      <button class="seg-btn ${state.myTab==='upcoming'?'active':''}" onclick="state.myTab='upcoming';render()">Предстоящие</button>
      <button class="seg-btn ${state.myTab==='history'?'active':''}" onclick="state.myTab='history';render()">История</button>
    </div>
  `;

  if (!list.length) {
    html += `<div class="card muted" style="text-align:center;padding:28px">Записей пока нет</div>`;
  }

  list.forEach(a => {
    const meta = getStatusMeta(a.status);
    const visitDt = new Date(`${a.date}T${a.time}:00`);
    const hoursLeft = (visitDt - new Date()) / 3600000;
    const canCancel = hoursLeft >= Number(db.settings.cancelLimitHours || 0);

    html += `
      <div class="card">
        <div class="row">
          <div>
            <div style="font-weight:700">${a.date} в ${a.time}</div>
            <div class="muted">${(a.services || []).map(s => s.title).join(', ')}</div>
          </div>
          <div style="text-align:right">
            <div class="price">${fmtRub(a.totalPrice)}</div>
            <span class="badge ${meta.badge}">${meta.label}</span>
          </div>
        </div>
        ${state.myTab === 'upcoming' ? `
          <div class="row" style="margin-top:10px">
            ${canCancel
              ? `<button class="btn btn-danger btn-sm" style="flex:1" onclick="changeStatus('${a.id}','${STATUS.CANCELLED}')">Отменить запись</button>`
              : `<a class="btn btn-soft btn-sm" style="flex:1" href="https://t.me/${db.settings.masterTelegram}" target="_blank">Написать мастеру</a>`
            }
          </div>
        ` : ''}
      </div>
    `;
  });

  document.getElementById('app').innerHTML = html;
}

function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalBackdrop').classList.add('open');
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('open');
}

render();
syncFromSheets(false);
</script>
